<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PA#3</title>
  <link rel="stylesheet" href="./style.css" />

  <script src="./Utils/trackball-rotator.js"></script>
  <script src="./Utils/m4.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="./shaders/shaders.js"></script>
  <script src="./Surface.js"></script>
  <script src="./ShProgram.js"></script>
  <script src="./main.js"></script>
  <script src="./ui.js"></script>
</head>

<body onload="init()">
  <h1>Practical assignment #3 (Texturing)</h1>
  <p id="message">
    Author: Demyd Demydovych, TR-42mp<br>
    Surface: Parabolic Humming-Top<br>
    Task: Prioritize normal
  </p>
  <div class="surface-parameters">
    <div class="input-block">
      <p>Surface parameters</p>
      <div class="inputWithLabel">
        <label for="h">h</label>
        <input type="number" id="h" value="0">
      </div>
      <div class="inputWithLabel">
        <label for="p">p</label>
        <input type="number" id="p" value="0">
      </div>
    </div>
    <div class="input-block">
      <p>Segments</p>
      <div class="inputWithLabelVertical">
        <p>U polylines</p>
        <div class="slider__box" segments="u">
          <span class="slider__btn" id="find"></span>
          <span class="slider__color"></span>
          <span class="slider__tooltip">65</span>
        </div>
      </div>
      <div class="inputWithLabelVertical">
        <p>V polylines</p>
        <div class="slider__box" segments="v">
          <span class="slider__btn" id="find"></span>
          <span class="slider__color"></span>
          <span class="slider__tooltip">65</span>
        </div>
      </div>
    </div>
  </div>
  <div id="canvas-holder">
    <canvas width="1200" height="500" id="webglcanvas"></canvas>
  </div>
</body>

</html>
